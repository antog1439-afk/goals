<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Планировщик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0f1c;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            color: #eef2ff;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
        }
        .card {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 24px 20px;
            margin-bottom: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .date-badge {
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #a5f3fc;
        }
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 20px;
        }
        .tab.active {
            color: white;
            background: #2d3a5e;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .add-btn {
            background: #3b4e7a;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            color: white;
            margin: 16px 0 12px 0;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-btn:active { background: #2a3a60; transform: scale(0.97); }
        .event-item {
            background: #0f172ad9;
            border-radius: 28px;
            padding: 16px 20px;
            margin-top: 16px;
            border-left: 5px solid #c084fc;
        }
        .event-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .event-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 14px;
            color: #b9c7e0;
            margin: 10px 0 8px 0;
        }
        .days-left {
            background: #2d374b;
            display: inline-block;
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 500;
            color: #facc15;
        }
        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #7e8aac;
        }
        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #5b6b8c;
            margin-top: 20px;
        }
        button {
            background: none;
            border: none;
        }
        .delete-event {
            background: #c2410c30;
            color: #f97316;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 40px;
            margin-top: 10px;
            width: auto;
            cursor: pointer;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: #111827;
            border-radius: 48px;
            padding: 28px 24px;
            width: 85%;
            max-width: 360px;
            border: 1px solid #334155;
        }
        .modal-card input {
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            border: none;
            background: #1f2a44;
            color: white;
            font-size: 16px;
            margin: 12px 0;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1>📅 Мой Планировщик</h1>
            <div class="date-badge" id="currentDate"></div>
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="events">📋 События</div>
            <div class="tab" data-tab="history">✅ История</div>
            <div class="tab" data-tab="notes">📝 Заметки</div>
        </div>

        <div id="eventsPanel">
            <button class="add-btn" id="openEventModalBtn">➕ Добавить событие</button>
            <div id="eventsList"></div>
        </div>

        <div id="historyPanel" class="hidden">
            <div id="historyList" class="empty-state">✨ Выполненные события появятся здесь</div>
        </div>

        <div id="notesPanel" class="hidden">
            <textarea id="notesText" rows="5" placeholder="Ваши заметки... (сохраняются автоматически)" style="width:100%; background:#0f172a; border:1px solid #2d3a5e; border-radius:24px; padding:16px; color:white; font-size:15px;"></textarea>
            <div class="footer-note" style="margin-top:12px;">💾 Заметки сохраняются на вашем устройстве</div>
        </div>
    </div>
    <div class="footer-note">🎯 ставь цели и ничего не забывай</div>
</div>

<!-- Модалка добавления события -->
<div id="eventModal" class="modal hidden">
    <div class="modal-card">
        <h3 style="margin-bottom: 8px;">➕ Новое событие</h3>
        <input type="text" id="eventTitle" placeholder="Название, например Концерт BIG BABY TAPE" autocomplete="off">
        <input type="datetime-local" id="eventDatetime">
        <div class="modal-buttons">
            <button id="saveEventBtn" style="background:#3b4e7a;">Сохранить</button>
            <button id="closeModalBtn" style="background:#1e293b;">Отмена</button>
        </div>
    </div>
</div>

<script>
    // -------- Хранилище --------
    let events = [];       // { id, title, datetime, completed }
    let completedEvents = [];
    let notes = "";

    // Загрузка из localStorage
    function loadData() {
        const savedEvents = localStorage.getItem("planner_events");
        if(savedEvents) events = JSON.parse(savedEvents);
        const savedCompleted = localStorage.getItem("planner_completed");
        if(savedCompleted) completedEvents = JSON.parse(savedCompleted);
        const savedNotes = localStorage.getItem("planner_notes");
        if(savedNotes !== null) notes = savedNotes;
        document.getElementById("notesText").value = notes;
    }

    function saveEvents() {
        localStorage.setItem("planner_events", JSON.stringify(events));
    }
    function saveCompleted() {
        localStorage.setItem("planner_completed", JSON.stringify(completedEvents));
    }
    function saveNotes() {
        localStorage.setItem("planner_notes", notes);
    }

    // ---- рендер событий (активные) ----
    function renderEvents() {
        const container = document.getElementById("eventsList");
        if(!events.length) {
            container.innerHTML = `<div class="empty-state">🎯 Нет запланированных событий<br>Нажмите «Добавить событие»</div>`;
            return;
        }
        // сортировка по дате (ближайшие первые)
        const sorted = [...events].sort((a,b) => new Date(a.datetime) - new Date(b.datetime));
        container.innerHTML = sorted.map(ev => {
            const eventDate = new Date(ev.datetime);
            const now = new Date();
            const diffDays = Math.ceil((eventDate - now) / (1000 * 60 * 60 * 24));
            let daysText = "";
            if(diffDays > 0) daysText = `${diffDays} ${declension(diffDays, "день", "дня", "дней")} осталось`;
            else if(diffDays === 0) daysText = "🚀 СЕГОДНЯ!";
            else daysText = "📅 Прошло";
            
            function declension(n, one, two, five) {
                n = Math.abs(n);
                if(n % 10 === 1 && n % 100 !== 11) return one;
                if(n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return two;
                return five;
            }
            
            const formattedDate = eventDate.toLocaleString("ru-RU", {day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"});
            return `
                <div class="event-item" data-id="${ev.id}">
                    <div class="event-title">📌 ${escapeHtml(ev.title)}</div>
                    <div class="event-meta">
                        <span>📅 ${formattedDate}</span>
                        <span class="days-left">${daysText}</span>
                    </div>
                    <div style="display: flex; gap: 12px; margin-top: 12px;">
                        <button class="delete-event" data-id="${ev.id}" data-action="complete">✅ Выполнить</button>
                        <button class="delete-event" data-id="${ev.id}" data-action="delete">🗑️ Удалить</button>
                    </div>
                </div>
            `;
        }).join('');
        
        // обработчики для кнопок
        document.querySelectorAll('.delete-event').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.dataset.id);
                const action = btn.dataset.action;
                if(action === 'complete') {
                    completeEvent(id);
                } else if(action === 'delete') {
                    deleteEventImmediately(id);
                }
            });
        });
    }
    
    function completeEvent(id) {
        const eventIndex = events.findIndex(e => e.id === id);
        if(eventIndex !== -1) {
            const completedEvent = {...events[eventIndex], completedAt: new Date().toISOString()};
            completedEvents.unshift(completedEvent);
            events.splice(eventIndex, 1);
            saveEvents();
            saveCompleted();
            renderEvents();
            renderHistory();
        }
    }
    
    function deleteEventImmediately(id) {
        events = events.filter(e => e.id !== id);
        saveEvents();
        renderEvents();
    }
    
    function renderHistory() {
        const container = document.getElementById("historyList");
        if(!completedEvents.length) {
            container.innerHTML = `<div class="empty-state">✨ Выполненные события появятся здесь</div>`;
            return;
        }
        container.innerHTML = completedEvents.map(ev => {
            const eventDate = new Date(ev.datetime);
            const formattedDate = eventDate.toLocaleString("ru-RU", {day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"});
            return `
                <div class="event-item" style="border-left-color: #4ade80; opacity:0.85;">
                    <div class="event-title">✅ ${escapeHtml(ev.title)}</div>
                    <div class="event-meta">
                        <span>📅 ${formattedDate}</span>
                        <span>✔️ завершено</span>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    function saveNotesToStorage() {
        notes = document.getElementById("notesText").value;
        saveNotes();
    }
    
    // ---- модалка ----
    const modal = document.getElementById("eventModal");
    const openBtn = document.getElementById("openEventModalBtn");
    const closeBtn = document.getElementById("closeModalBtn");
    const saveBtn = document.getElementById("saveEventBtn");
    const titleInput = document.getElementById("eventTitle");
    const datetimeInput = document.getElementById("eventDatetime");
    
    function openModal() {
        titleInput.value = "";
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        datetimeInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
        modal.classList.remove("hidden");
    }
    
    function closeModal() {
        modal.classList.add("hidden");
    }
    
    function addEventFromModal() {
        let title = titleInput.value.trim();
        if(!title) {
            alert("Введите название события");
            return;
        }
        let datetime = datetimeInput.value;
        if(!datetime) {
            alert("Выберите дату и время");
            return;
        }
        const newEvent = {
            id: Date.now(),
            title: title,
            datetime: datetime,
            createdAt: new Date().toISOString()
        };
        events.push(newEvent);
        saveEvents();
        renderEvents();
        closeModal();
    }
    
    // Табы
    const eventsPanel = document.getElementById("eventsPanel");
    const historyPanel = document.getElementById("historyPanel");
    const notesPanel = document.getElementById("notesPanel");
    const tabs = document.querySelectorAll(".tab");
    
    function switchTab(tabId) {
        eventsPanel.classList.add("hidden");
        historyPanel.classList.add("hidden");
        notesPanel.classList.add("hidden");
        if(tabId === "events") eventsPanel.classList.remove("hidden");
        if(tabId === "history") historyPanel.classList.remove("hidden");
        if(tabId === "notes") notesPanel.classList.remove("hidden");
        tabs.forEach(t => {
            if(t.dataset.tab === tabId) t.classList.add("active");
            else t.classList.remove("active");
        });
        if(tabId === "history") renderHistory();
        if(tabId === "notes") document.getElementById("notesText").value = notes;
    }
    
    // инициализация и слушатели
    loadData();
    renderEvents();
    renderHistory();
    document.getElementById("notesText").addEventListener("input", saveNotesToStorage);
    
    openBtn.addEventListener("click", openModal);
    closeBtn.addEventListener("click", closeModal);
    saveBtn.addEventListener("click", addEventFromModal);
    modal.addEventListener("click", (e) => { if(e.target === modal) closeModal(); });
    
    tabs.forEach(tab => {
        tab.addEventListener("click", () => {
            switchTab(tab.dataset.tab);
        });
    });
    
    // показать текущую дату в шапке
    const today = new Date();
    const options = { day: 'numeric', month: 'long', year: 'numeric' };
    document.getElementById("currentDate").innerText = today.toLocaleDateString("ru-RU", options);
    
    function escapeHtml(str) {
        if(!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
</script>
</body>
</html>
