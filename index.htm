<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мой Планировщик</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border: none;
            border-radius: 10px;
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab.active {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 10px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
            font-family: inherit;
        }
        textarea { resize: vertical; }
        button {
            width: 100%;
            padding: 14px;
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        .event-item, .note-item {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .note-title {
            font-weight: bold;
            font-size: 16px;
            flex: 1;
        }
        .note-actions {
            display: flex;
            gap: 8px;
        }
        .edit-btn, .delete-note-btn {
            padding: 6px 12px;
            width: auto;
            font-size: 12px;
        }
        .edit-btn { background: var(--tg-theme-button-color, #3390ec); }
        .delete-note-btn { background: #ff3b30; }
        .event-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .event-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .event-info { flex: 1; }
        .event-name { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .event-date { font-size: 14px; color: var(--tg-theme-hint-color, #666666); margin-bottom: 5px; }
        .event-days { font-size: 14px; margin-top: 5px; color: var(--tg-theme-button-color, #3390ec); }
        .delete-event-btn {
            background: #ff3b30;
            padding: 8px 15px;
            width: auto;
            font-size: 14px;
        }
        .note-content {
            font-size: 14px;
            color: var(--tg-theme-text-color, #000000);
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .note-date {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666666);
        }
        .empty-state { text-align: center; padding: 40px; color: var(--tg-theme-hint-color, #666666); }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }
        .modal-content {
            background: var(--tg-theme-bg-color, #ffffff);
            border-radius: 15px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h3 { margin-bottom: 20px; }
        .success-msg {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #4cd964;
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1001;
        }
        .close-modal-btn {
            background: #ff3b30;
            margin-top: 10px;
        }
        hr {
            margin: 15px 0;
            border-color: var(--tg-theme-hint-color, #cccccc);
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Мой Планировщик</h1>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="showTab('events')">📅 События</button>
            <button class="tab" onclick="showTab('notes')">📝 Заметки</button>
        </div>
        
        <div id="eventsTab">
            <button onclick="showAddEventModal()" style="margin-bottom: 20px;">➕ Добавить событие</button>
            <div id="eventsList"></div>
        </div>
        
        <div id="notesTab" style="display: none;">
            <button onclick="showAddNoteModal()" style="margin-bottom: 20px;">📝 Добавить заметку</button>
            <div id="notesList"></div>
        </div>
    </div>
    
    <!-- Модальное окно для добавления/редактирования события -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <h3 id="eventModalTitle">➕ Новое событие</h3>
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="eventName" placeholder="Например: День рождения">
            </div>
            <div class="form-group">
                <label>Дата</label>
                <input type="date" id="eventDate">
            </div>
            <input type="hidden" id="editEventId">
            <button onclick="saveEvent()">Сохранить</button>
            <button onclick="closeModal('eventModal')" class="close-modal-btn">Отмена</button>
        </div>
    </div>
    
    <!-- Модальное окно для добавления/редактирования заметки -->
    <div id="noteModal" class="modal">
        <div class="modal-content">
            <h3 id="noteModalTitle">📝 Новая заметка</h3>
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="noteTitle" placeholder="Цель на 2026 год">
            </div>
            <div class="form-group">
                <label>Содержание</label>
                <textarea id="noteContent" rows="4" placeholder="Что нужно сделать..."></textarea>
            </div>
            <input type="hidden" id="editNoteId">
            <button onclick="saveNote()">Сохранить</button>
            <button onclick="closeModal('noteModal')" class="close-modal-btn">Отмена</button>
        </div>
    </div>
    
    <div id="successMsg" class="success-msg"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.hide();
        
        // Получаем ID пользователя из Telegram
        let userId = tg.initDataUnsafe?.user?.id || 'anonymous';
        
        // Ключи для CloudStorage
        const EVENTS_KEY = `events_${userId}`;
        const NOTES_KEY = `notes_${userId}`;
        
        // Показать сообщение об успехе
        function showMessage(text, isError = false) {
            const msg = document.getElementById('successMsg');
            msg.textContent = text;
            msg.style.backgroundColor = isError ? '#ff3b30' : '#4cd964';
            msg.style.opacity = '1';
            setTimeout(() => {
                msg.style.opacity = '0';
            }, 2000);
        }
        
        // Загрузка событий из CloudStorage
        async function loadEvents() {
            Telegram.WebApp.CloudStorage.getItems([EVENTS_KEY], (err, items) => {
                if (err) {
                    console.error('Ошибка загрузки:', err);
                    return;
                }
                
                let events = [];
                if (items[EVENTS_KEY]) {
                    try {
                        events = JSON.parse(items[EVENTS_KEY]);
                    } catch(e) { events = []; }
                }
                
                const container = document.getElementById('eventsList');
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                if (events.length === 0) {
                    container.innerHTML = '<div class="empty-state">📭 Нет событий. Добавьте первое!</div>';
                    return;
                }
                
                events.sort((a, b) => new Date(a.date) - new Date(b.date));
                
                container.innerHTML = events.map(event => {
                    const eventDate = new Date(event.date);
                    const daysLeft = Math.ceil((eventDate - today) / (1000 * 60 * 60 * 24));
                    
                    let status = '';
                    if (daysLeft > 0) status = `⏳ ${daysLeft} дней осталось`;
                    else if (daysLeft === 0) status = '🎉 СЕГОДНЯ! 🎉';
                    else status = `✅ Прошло ${-daysLeft} дней`;
                    
                    return `
                        <div class="event-item">
                            <div class="event-info">
                                <div class="event-name">📌 ${escapeHtml(event.name)}</div>
                                <div class="event-date">📅 ${event.date}</div>
                                <div class="event-days">${status}</div>
                            </div>
                            <div class="event-actions">
                                <button class="edit-btn" onclick="editEvent(${event.id})" style="padding: 8px 12px; width: auto;">✏️</button>
                                <button class="delete-event-btn" onclick="deleteEvent(${event.id})">🗑</button>
                            </div>
                        </div>
                    `;
                }).join('');
            });
        }
        
        // Загрузка заметок из CloudStorage
        async function loadNotes() {
            Telegram.WebApp.CloudStorage.getItems([NOTES_KEY], (err, items) => {
                if (err) {
                    console.error('Ошибка загрузки:', err);
                    return;
                }
                
                let notes = [];
                if (items[NOTES_KEY]) {
                    try {
                        notes = JSON.parse(items[NOTES_KEY]);
                    } catch(e) { notes = []; }
                }
                
                const container = document.getElementById('notesList');
                
                if (notes.length === 0) {
                    container.innerHTML = '<div class="empty-state">📭 Нет заметок. Добавьте первую!</div>';
                    return;
                }
                
                notes.reverse();
                
                container.innerHTML = notes.map(note => `
                    <div class="note-item">
                        <div class="note-header">
                            <div class="note-title">📌 ${escapeHtml(note.title)}</div>
                            <div class="note-actions">
                                <button class="edit-btn" onclick="editNote(${note.id})">✏️</button>
                                <button class="delete-note-btn" onclick="deleteNote(${note.id})">🗑</button>
                            </div>
                        </div>
                        <div class="note-content">${escapeHtml(note.content)}</div>
                        <div class="note-date">📅 ${note.created_at}</div>
                    </div>
                `).join('');
            });
        }
        
        // Сохранение события (добавление или редактирование)
        function saveEvent() {
            const name = document.getElementById('eventName').value;
            const date = document.getElementById('eventDate').value;
            const editId = document.getElementById('editEventId').value;
            
            if (!name || !date) {
                tg.showAlert('Заполните все поля!');
                return;
            }
            
            Telegram.WebApp.CloudStorage.getItems([EVENTS_KEY], (err, items) => {
                let events = [];
                if (items[EVENTS_KEY]) {
                    try {
                        events = JSON.parse(items[EVENTS_KEY]);
                    } catch(e) { events = []; }
                }
                
                if (editId) {
                    // Редактирование существующего события
                    const index = events.findIndex(e => e.id == editId);
                    if (index !== -1) {
                        events[index].name = name;
                        events[index].date = date;
                        showMessage('✏️ Событие обновлено!');
                    }
                } else {
                    // Новое событие
                    events.push({
                        id: Date.now(),
                        name: name,
                        date: date,
                        created_at: new Date().toISOString().slice(0, 19).replace('T', ' ')
                    });
                    showMessage('✅ Событие добавлено!');
                }
                
                Telegram.WebApp.CloudStorage.setItem(EVENTS_KEY, JSON.stringify(events), (err, saved) => {
                    if (saved) {
                        closeModal('eventModal');
                        document.getElementById('eventName').value = '';
                        document.getElementById('eventDate').value = '';
                        document.getElementById('editEventId').value = '';
                        loadEvents();
                    } else {
                        showMessage('❌ Ошибка сохранения', true);
                    }
                });
            });
        }
        
        // Редактирование события
        function editEvent(eventId) {
            Telegram.WebApp.CloudStorage.getItems([EVENTS_KEY], (err, items) => {
                let events = [];
                if (items[EVENTS_KEY]) {
                    try {
                        events = JSON.parse(items[EVENTS_KEY]);
                    } catch(e) { events = []; }
                }
                
                const event = events.find(e => e.id == eventId);
                if (event) {
                    document.getElementById('eventModalTitle').textContent = '✏️ Редактировать событие';
                    document.getElementById('eventName').value = event.name;
                    document.getElementById('eventDate').value = event.date;
                    document.getElementById('editEventId').value = event.id;
                    document.getElementById('eventModal').style.display = 'flex';
                }
            });
        }
        
        // Удаление события
        function deleteEvent(eventId) {
            tg.showConfirm('Удалить событие?', (confirmed) => {
                if (confirmed) {
                    Telegram.WebApp.CloudStorage.getItems([EVENTS_KEY], (err, items) => {
                        let events = [];
                        if (items[EVENTS_KEY]) {
                            try {
                                events = JSON.parse(items[EVENTS_KEY]);
                            } catch(e) { events = []; }
                        }
                        
                        events = events.filter(e => e.id != eventId);
                        
                        Telegram.WebApp.CloudStorage.setItem(EVENTS_KEY, JSON.stringify(events), (err, saved) => {
                            if (saved) {
                                showMessage('🗑 Событие удалено');
                                loadEvents();
                            }
                        });
                    });
                }
            });
        }
        
        // Сохранение заметки (добавление или редактирование)
        function saveNote() {
            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;
            const editId = document.getElementById('editNoteId').value;
            
            if (!title || !content) {
                tg.showAlert('Заполните все поля!');
                return;
            }
            
            Telegram.WebApp.CloudStorage.getItems([NOTES_KEY], (err, items) => {
                let notes = [];
                if (items[NOTES_KEY]) {
                    try {
                        notes = JSON.parse(items[NOTES_KEY]);
                    } catch(e) { notes = []; }
                }
                
                if (editId) {
                    // Редактирование существующей заметки
                    const index = notes.findIndex(n => n.id == editId);
                    if (index !== -1) {
                        notes[index].title = title;
                        notes[index].content = content;
                        notes[index].updated_at = new Date().toLocaleString('ru-RU');
                        showMessage('✏️ Заметка обновлена!');
                    }
                } else {
                    // Новая заметка
                    notes.push({
                        id: Date.now(),
                        title: title,
                        content: content,
                        created_at: new Date().toLocaleString('ru-RU')
                    });
                    showMessage('✅ Заметка добавлена!');
                }
                
                Telegram.WebApp.CloudStorage.setItem(NOTES_KEY, JSON.stringify(notes), (err, saved) => {
                    if (saved) {
                        closeModal('noteModal');
                        document.getElementById('noteTitle').value = '';
                        document.getElementById('noteContent').value = '';
                        document.getElementById('editNoteId').value = '';
                        loadNotes();
                    } else {
                        showMessage('❌ Ошибка сохранения', true);
                    }
                });
            });
        }
        
        // Редактирование заметки
        function editNote(noteId) {
            Telegram.WebApp.CloudStorage.getItems([NOTES_KEY], (err, items) => {
                let notes = [];
                if (items[NOTES_KEY]) {
                    try {
                        notes = JSON.parse(items[NOTES_KEY]);
                    } catch(e) { notes = []; }
                }
                
                const note = notes.find(n => n.id == noteId);
                if (note) {
                    document.getElementById('noteModalTitle').textContent = '✏️ Редактировать заметку';
                    document.getElementById('noteTitle').value = note.title;
                    document.getElementById('noteContent').value = note.content;
                    document.getElementById('editNoteId').value = note.id;
                    document.getElementById('noteModal').style.display = 'flex';
                }
            });
        }
        
        // Удаление заметки
        function deleteNote(noteId) {
            tg.showConfirm('Удалить заметку?', (confirmed) => {
                if (confirmed) {
                    Telegram.WebApp.CloudStorage.getItems([NOTES_KEY], (err, items) => {
                        let notes = [];
                        if (items[NOTES_KEY]) {
                            try {
                                notes = JSON.parse(items[NOTES_KEY]);
                            } catch(e) { notes = []; }
                        }
                        
                        notes = notes.filter(n => n.id != noteId);
                        
                        Telegram.WebApp.CloudStorage.setItem(NOTES_KEY, JSON.stringify(notes), (err, saved) => {
                            if (saved) {
                                showMessage('🗑 Заметка удалена');
                                loadNotes();
                            }
                        });
                    });
                }
            });
        }
        
        function showTab(tab) {
            document.getElementById('eventsTab').style.display = tab === 'events' ? 'block' : 'none';
            document.getElementById('notesTab').style.display = tab === 'notes' ? 'block' : 'none';
            document.querySelectorAll('.tab').forEach((btn, i) => {
                btn.classList.toggle('active', (tab === 'events' && i === 0) || (tab === 'notes' && i === 1));
            });
            
            if (tab === 'events') loadEvents();
            else loadNotes();
        }
        
        function showAddEventModal() {
            document.getElementById('eventModalTitle').textContent = '➕ Новое событие';
            document.getElementById('eventName').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('editEventId').value = '';
            document.getElementById('eventModal').style.display = 'flex';
        }
        
        function showAddNoteModal() {
            document.getElementById('noteModalTitle').textContent = '📝 Новая заметка';
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('editNoteId').value = '';
            document.getElementById('noteModal').style.display = 'flex';
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Закрытие модалки по клику вне области
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }
        
        // Инициализация
        loadEvents();
    </script>
</body>
</html>
