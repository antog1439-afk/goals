<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мой Планировщик</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border: none;
            border-radius: 10px;
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab.active {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 10px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
            font-family: inherit;
        }
        textarea { resize: vertical; }
        button {
            width: 100%;
            padding: 14px;
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        .event-item, .note-item {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .note-header, .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .event-name, .note-title {
            font-weight: bold;
            font-size: 16px;
            flex: 1;
        }
        .event-actions, .note-actions {
            display: flex;
            gap: 8px;
        }
        .edit-btn, .delete-event-btn, .delete-note-btn {
            padding: 6px 12px;
            width: auto;
            font-size: 12px;
        }
        .edit-btn { background: var(--tg-theme-button-color, #3390ec); }
        .delete-event-btn, .delete-note-btn { background: #ff3b30; }
        .event-datetime {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #666666);
            margin-bottom: 5px;
        }
        .event-days {
            font-size: 14px;
            margin-top: 5px;
            color: var(--tg-theme-button-color, #3390ec);
            font-weight: 500;
        }
        .reminder-badge {
            display: inline-block;
            background: #ff9500;
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }
        .note-content {
            font-size: 14px;
            color: var(--tg-theme-text-color, #000000);
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .note-date {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666666);
        }
        .empty-state { text-align: center; padding: 40px; color: var(--tg-theme-hint-color, #666666); }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }
        .modal-content {
            background: var(--tg-theme-bg-color, #ffffff);
            border-radius: 15px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h3 { margin-bottom: 20px; }
        .success-msg {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #4cd964;
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1001;
        }
        .close-modal-btn {
            background: #ff3b30;
            margin-top: 10px;
        }
        .reminder-options {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .reminder-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .reminder-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .reminder-checkboxes label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            cursor: pointer;
        }
        .reminder-checkboxes input {
            width: auto;
            margin: 0;
        }
        hr {
            margin: 15px 0;
            border-color: var(--tg-theme-hint-color, #cccccc);
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Мой Планировщик</h1>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="showTab('events')">📅 События</button>
            <button class="tab" onclick="showTab('notes')">📝 Заметки</button>
        </div>
        
        <div id="eventsTab">
            <button onclick="showAddEventModal()" style="margin-bottom: 20px;">➕ Добавить событие</button>
            <div id="eventsList"></div>
        </div>
        
        <div id="notesTab" style="display: none;">
            <button onclick="showAddNoteModal()" style="margin-bottom: 20px;">📝 Добавить заметку</button>
            <div id="notesList"></div>
        </div>
    </div>
    
    <!-- Модальное окно для добавления/редактирования события -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <h3 id="eventModalTitle">➕ Новое событие</h3>
            <div class="form-group">
                <label>Название события</label>
                <input type="text" id="eventName" placeholder="Например: День рождения">
            </div>
            <div class="form-group">
                <label>Дата и время</label>
                <input type="datetime-local" id="eventDatetime">
            </div>
            
            <div class="reminder-options">
                <div class="reminder-title">⏰ Напоминания</div>
                <div class="reminder-checkboxes">
                    <label><input type="checkbox" value="30" class="reminder-check"> за 30 дней</label>
                    <label><input type="checkbox" value="20" class="reminder-check"> за 20 дней</label>
                    <label><input type="checkbox" value="15" class="reminder-check"> за 15 дней</label>
                    <label><input type="checkbox" value="10" class="reminder-check"> за 10 дней</label>
                    <label><input type="checkbox" value="5" class="reminder-check"> за 5 дней</label>
                    <label><input type="checkbox" value="2" class="reminder-check"> за 2 дня</label>
                    <label><input type="checkbox" value="1" class="reminder-check"> за 1 день</label>
                </div>
            </div>
            
            <input type="hidden" id="editEventId">
            <button onclick="saveEvent()">Сохранить</button>
            <button onclick="closeModal('eventModal')" class="close-modal-btn">Отмена</button>
        </div>
    </div>
    
    <!-- Модальное окно для добавления/редактирования заметки -->
    <div id="noteModal" class="modal">
        <div class="modal-content">
            <h3 id="noteModalTitle">📝 Новая заметка</h3>
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="noteTitle" placeholder="Цель на 2026 год">
            </div>
            <div class="form-group">
                <label>Содержание</label>
                <textarea id="noteContent" rows="4" placeholder="Что нужно сделать..."></textarea>
            </div>
            <input type="hidden" id="editNoteId">
            <button onclick="saveNote()">Сохранить</button>
            <button onclick="closeModal('noteModal')" class="close-modal-btn">Отмена</button>
        </div>
    </div>
    
    <div id="successMsg" class="success-msg"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.hide();
        
        let userId = tg.initDataUnsafe?.user?.id || 'anonymous';
        
        const EVENTS_KEY = `events_${userId}`;
        const NOTES_KEY = `notes_${userId}`;
        const REMINDERS_KEY = `reminders_${userId}`;
        
        function showMessage(text, isError = false) {
            const msg = document.getElementById('successMsg');
            msg.textContent = text;
            msg.style.backgroundColor = isError ? '#ff3b30' : '#4cd964';
            msg.style.opacity = '1';
            setTimeout(() => {
                msg.style.opacity = '0';
            }, 2000);
        }
        
        // Проверка и отправка напоминаний
        function checkAndSendReminders() {
            Telegram.WebApp.CloudStorage.getItems([EVENTS_KEY, REMINDERS_KEY], (err, items) => {
                if (err) return;
                
                let events = [];
                if (items[EVENTS_KEY]) {
                    try { events = JSON.parse(items[EVENTS_KEY]); } catch(e) {}
                }
                
                let sentReminders = [];
                if (items[REMINDERS_KEY]) {
                    try { sentReminders = JSON.parse(items[REMINDERS_KEY]); } catch(e) {}
                }
                
                const now = new Date();
                const todayStr = now.toDateString();
                
                events.forEach(event => {
                    const eventDateTime = new Date(event.datetime);
                    const daysLeft = Math.ceil((eventDateTime - now) / (1000 * 60 * 60 * 24));
                    
                    if (event.reminders && event.reminders.length > 0) {
                        event.reminders.forEach(days => {
                            const reminderKey = `${event.id}_${days}`;
                            const shouldRemind = daysLeft === parseInt(days);
                            
                            if (shouldRemind && !sentReminders.includes(reminderKey)) {
                                sentReminders.push(reminderKey);
                                
                                tg.showPopup({
                                    title: '🔔 Напоминание',
                                    message: `Событие "${event.name}" через ${days} дней!\nДата: ${event.datetime.replace('T', ' в ')}`,
                                    buttons: [{type: 'ok'}]
                                });
                            }
                        });
                    }
                });
                
                Telegram.WebApp.CloudStorage.setItem(REMINDERS_KEY, JSON.stringify(sentReminders));
            });
        }
        
        // Загрузка событий
        function loadEvents() {
            Telegram.WebApp.CloudStorage.getItems([EVENTS_KEY], (err, items) => {
                if (err) { console.error(err); return; }
                
                let events = [];
                if (items[EVENTS_KEY]) {
                    try { events = JSON.parse(items[EVENTS_KEY]); } catch(e) { events = []; }
                }
                
                const container = document.getElementById('eventsList');
                const now = new Date();
                
                if (events.length === 0) {
                    container.innerHTML = '<div class="empty-state">📭 Нет событий. Добавьте первое!</div>';
                    return;
                }
                
                events.sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
                
                container.innerHTML = events.map(event => {
                    const eventDateTime = new Date(event.datetime);
                    const daysLeft = Math.ceil((eventDateTime - now) / (1000 * 60 * 60 * 24));
                    const hoursLeft = Math.floor((eventDateTime - now) / (1000 * 60 * 60));
                    
                    let status = '';
                    if (daysLeft > 1) status = `⏳ ${daysLeft} дней осталось`;
                    else if (daysLeft === 1) status = `⏳ ${hoursLeft} часов осталось`;
                    else if (daysLeft === 0 && eventDateTime > now) status = `⏰ Сегодня в ${event.datetime.slice(11, 16)}`;
                    else if (daysLeft === 0 && eventDateTime <= now) status = '🎉 СЕГОДНЯ! 🎉';
                    else status = `✅ Прошло ${-daysLeft} дней назад`;
                    
                    const formattedDatetime = event.datetime.replace('T', ' в ');
                    const reminderCount = event.reminders ? event.reminders.length : 0;
                    const reminderBadge = reminderCount > 0 ? `<span class="reminder-badge">🔔 ${reminderCount}</span>` : '';
                    
                    return `
                        <div class="event-item">
                            <div class="event-header">
                                <div class="event-name">📌 ${escapeHtml(event.name)} ${reminderBadge}</div>
                                <div class="event-actions">
                                    <button class="edit-btn" onclick="editEvent(${event.id})">✏️</button>
                                    <button class="delete-event-btn" onclick="deleteEvent(${event.id})">🗑</button>
                                </div>
                            </div>
                            <div class="event-datetime">📅 ${formattedDatetime}</div>
                            <div class="event-days">${status}</div>
                        </div>
                    `;
                }).join('');
                
                checkAndSendReminders();
            });
        }
        
        // Сохранение события
        function saveEvent() {
            const name = document.getElementById('eventName').value;
            const datetime = document.getElementById('eventDatetime').value;
            const editId = document.getElementById('editEventId').value;
            
            const reminderChecks = document.querySelectorAll('.reminder-check:checked');
            const reminders = Array.from(reminderChecks).map(cb => parseInt(cb.value));
            
            if (!name || !datetime) {
                tg.showAlert('Заполните все поля!');
                return;
            }
            
            Telegram.WebApp.CloudStorage.getItems([EVENTS_KEY], (err, items) => {
                let events = [];
                if (items[EVENTS_KEY]) {
                    try { events = JSON.parse(items[EVENTS_KEY]); } catch(e) { events = []; }
                }
                
                if (editId) {
                    const index = events.findIndex(e => e.id == editId);
                    if (index !== -1) {
                        events[index].name = name;
                        events[index].datetime = datetime;
                        events[index].reminders = reminders;
                        showMessage('✏️ Событие обновлено!');
                    }
                } else {
                    events.push({
                        id: Date.now(),
                        name: name,
                        datetime: datetime,
                        reminders: reminders,
                        created_at: new Date().toISOString()
                    });
                    showMessage('✅ Событие добавлено!');
                }
                
                Telegram.WebApp.CloudStorage.setItem(EVENTS_KEY, JSON.stringify(events), (err, saved) => {
                    if (saved) {
                        closeModal('eventModal');
                        document.getElementById('eventName').value = '';
                        document.getElementById('eventDatetime').value = '';
                        document.getElementById('editEventId').value = '';
                        document.querySelectorAll('.reminder-check').forEach(cb => cb.checked = false);
                        loadEvents();
                    } else {
                        showMessage('❌ Ошибка сохранения', true);
                    }
                });
            });
        }
        
        // Редактирование события
        function editEvent(eventId) {
            Telegram.WebApp.CloudStorage.getItems([EVENTS_KEY], (err, items) => {
                let events = [];
                if (items[EVENTS_KEY]) {
                    try { events = JSON.parse(items[EVENTS_KEY]); } catch(e) { events = []; }
                }
                
                const event = events.find(e => e.id == eventId);
                if (event) {
                    document.getElementById('eventModalTitle').textContent = '✏️ Редактировать событие';
                    document.getElementById('eventName').value = event.name;
                    document.getElementById('eventDatetime').value = event.datetime;
                    document.getElementById('editEventId').value = event.id;
                    
                    document.querySelectorAll('.reminder-check').forEach(cb => {
                        cb.checked = event.reminders && event.reminders.includes(parseInt(cb.value));
                    });
                    
                    document.getElementById('eventModal').style.display = 'flex';
                }
            });
        }
        
        // Удаление события
        function deleteEvent(eventId) {
            tg.showConfirm('Удалить событие?', (confirmed) => {
                if (confirmed) {
                    Telegram.WebApp.CloudStorage.getItems([EVENTS_KEY], (err, items) => {
                        let events = [];
                        if (items[EVENTS_KEY]) {
                            try { events = JSON.parse(items[EVENTS_KEY]); } catch(e) { events = []; }
                        }
                        
                        events = events.filter(e => e.id != eventId);
                        
                        Telegram.WebApp.CloudStorage.setItem(EVENTS_KEY, JSON.stringify(events), (err, saved) => {
                            if (saved) {
                                showMessage('🗑 Событие удалено');
                                loadEvents();
                            }
                        });
                    });
                }
            });
        }
        
        // Загрузка заметок
        function loadNotes() {
            Telegram.WebApp.CloudStorage.getItems([NOTES_KEY], (err, items) => {
                if (err) { console.error(err); return; }
                
                let notes = [];
                if (items[NOTES_KEY]) {
                    try { notes = JSON.parse(items[NOTES_KEY]); } catch(e) { notes = []; }
                }
                
                const container = document.getElementById('notesList');
                
                if (notes.length === 0) {
                    container.innerHTML = '<div class="empty-state">📭 Нет заметок. Добавьте первую!</div>';
                    return;
                }
                
                notes.reverse();
                
                container.innerHTML = notes.map(note => `
                    <div class="note-item">
                        <div class="note-header">
                            <div class="note-title">📌 ${escapeHtml(note.title)}</div>
                            <div class="note-actions">
                                <button class="edit-btn" onclick="editNote(${note.id})">✏️</button>
                                <button class="delete-note-btn" onclick="deleteNote(${note.id})">🗑</button>
                            </div>
                        </div>
                        <div class="note-content">${escapeHtml(note.content)}</div>
                        <div class="note-date">📅 ${note.created_at}</div>
                    </div>
                `).join('');
            });
        }
        
        // Сохранение заметки
        function saveNote() {
            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;
            const editId = document.getElementById('editNoteId').value;
            
            if (!title || !content) {
                tg.showAlert('Заполните все поля!');
                return;
            }
            
            Telegram.WebApp.CloudStorage.getItems([NOTES_KEY], (err, items) => {
                let notes = [];
                if (items[NOTES_KEY]) {
                    try { notes = JSON.parse(items[NOTES_KEY]); } catch(e) { notes = []; }
                }
                
                if (editId) {
                    const index = notes.findIndex(n => n.id == editId);
                    if (index !== -1) {
                        notes[index].title = title;
                        notes[index].content = content;
                        notes[index].updated_at = new Date().toLocaleString('ru-RU');
                        showMessage('✏️ Заметка обновлена!');
                    }
                } else {
                    notes.push({
                        id: Date.now(),
                        title: title,
                        content: content,
                        created_at: new Date().toLocaleString('ru-RU')
                    });
                    showMessage('✅ Заметка добавлена!');
                }
                
                Telegram.WebApp.CloudStorage.setItem(NOTES_KEY, JSON.stringify(notes), (err, saved) => {
                    if (saved) {
                        closeModal('noteModal');
                        document.getElementById('noteTitle').value = '';
                        document.getElementById('noteContent').value = '';
                        document.getElementById('editNoteId').value = '';
                        loadNotes();
                    } else {
                        showMessage('❌ Ошибка сохранения', true);
                    }
                });
            });
        }
        
        // Редактирование заметки
        function editNote(noteId) {
            Telegram.WebApp.CloudStorage.getItems([NOTES_KEY], (err, items) => {
                let notes = [];
                if (items[NOTES_KEY]) {
                    try { notes = JSON.parse(items[NOTES_KEY]); } catch(e) { notes = []; }
                }
                
                const note = notes.find(n => n.id == noteId);
                if (note) {
                    document.getElementById('noteModalTitle').textContent = '✏️ Редактировать заметку';
                    document.getElementById('noteTitle').value = note.title;
                    document.getElementById('noteContent').value = note.content;
                    document.getElementById('editNoteId').value = note.id;
                    document.getElementById('noteModal').style.display = 'flex';
                }
            });
        }
        
        // Удаление заметки
        function deleteNote(noteId) {
            tg.showConfirm('Удалить заметку?', (confirmed) => {
                if (confirmed) {
                    Telegram.WebApp.CloudStorage.getItems([NOTES_KEY], (err, items) => {
                        let notes = [];
                        if (items[NOTES_KEY]) {
                            try { notes = JSON.parse(items[NOTES_KEY]); } catch(e) { notes = []; }
                        }
                        
                        notes = notes.filter(n => n.id != noteId);
                        
                        Telegram.WebApp.CloudStorage.setItem(NOTES_KEY, JSON.stringify(notes), (err, saved) => {
                            if (saved) {
                                showMessage('🗑 Заметка удалена');
                                loadNotes();
                            }
                        });
                    });
                }
            });
        }
        
        function showTab(tab) {
            document.getElementById('eventsTab').style.display = tab === 'events' ? 'block' : 'none';
            document.getElementById('notesTab').style.display = tab === 'notes' ? 'block' : 'none';
            document.querySelectorAll('.tab').forEach((btn, i) => {
                btn.classList.toggle('active', (tab === 'events' && i === 0) || (tab === 'notes' && i === 1));
            });
            if (tab === 'events') loadEvents();
            else loadNotes();
        }
        
        function showAddEventModal() {
            document.getElementById('eventModalTitle').textContent = '➕ Новое событие';
            document.getElementById('eventName').value = '';
            document.getElementById('eventDatetime').value = '';
            document.getElementById('editEventId').value = '';
            document.querySelectorAll('.reminder-check').forEach(cb => cb.checked = false);
            document.getElementById('eventModal').style.display = 'flex';
        }
        
        function showAddNoteModal() {
            document.getElementById('noteModalTitle').textContent = '📝 Новая заметка';
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('editNoteId').value = '';
            document.getElementById('noteModal').style.display = 'flex';
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }
        
        // Проверка напоминаний каждые 30 секунд
        setInterval(checkAndSendReminders, 30000);
        
        loadEvents();
    </script>
</body>
</html>
